{% extends "admin/base.html" %}

{% block title %}ورود به پنل مدیریت | Candy{% endblock %}

{% block login_content %}
<div class="login-page">
    <div class="glass-card login-card">
        <div class="brand">🍬 <span>Candy</span></div>
        <h2 style="margin-bottom: 2rem;">ورود به مدیریت</h2>
        
        {% if error %}
            <div class="badge badge-danger" style="margin-bottom: 1rem; display: block; padding: 1rem;">{{ error }}</div>
        {% endif %}
        
        <form method="POST" action="/admin/login">
            <div class="form-group" style="text-align: right;">
                <label class="form-label">نام کاربری</label>
                <input type="text" name="username" class="glass-input" required autofocus>
            </div>
            <div class="form-group" style="text-align: right;">
                <label class="form-label">رمز عبور</label>
                <input type="password" name="password" class="glass-input" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">ورود</button>
        </form>
    </div>
</div>
{% endblock %}
