{% extends "admin/base.html" %}

{% block page_title %}پیام همگانی (Broadcast){% endblock %}

{% block content %}
<div class="glass-card" style="margin-bottom: 2rem;">
    <h3>ارسال پیام به تمامی کاربران</h3>
    <form method="POST" action="/admin/broadcast">
        <div class="form-group">
            <label class="form-label">متن پیام (پشتیبانی از تگ‌های HTML نظیر &lt;b&gt; و &lt;i&gt;)</label>
            <textarea name="message" class="glass-input glass-textarea" placeholder="سلام کاربر عزیز..." required></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top: 1rem;">ارسال به صف (Queue)</button>
    </form>
</div>
{% endblock %}
